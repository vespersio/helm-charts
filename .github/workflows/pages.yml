name: Publish catalog

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "state/**"
      - "site/**"
      - "scripts/build_catalog.py"
      - "scripts/mirror.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - Sync Helm charts
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest catalog state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration and state
        run: python3 scripts/mirror.py validate

      - name: Build catalog
        run: python3 scripts/build_catalog.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
