name: Sync Helm charts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository id, comma-separated ids, or all"
        required: true
        default: all
        type: string
      mode:
        description: "Initial synchronization mode"
        required: true
        default: config
        type: choice
        options:
          - config
          - new
          - all
      batch_size:
        description: "Per-repository limit; 0 uses config"
        required: true
        default: "0"
        type: string
      dry_run:
        description: "Build and print the plan without publishing"
        required: true
        default: false
        type: boolean

concurrency:
  group: helm-charts-sync
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Validate configuration and state
        run: python3 scripts/mirror.py validate

      - name: Build synchronization plan
        id: plan
        env:
          REPOSITORY: ${{ inputs.repository || 'all' }}
          MODE: ${{ inputs.mode || 'config' }}
          BATCH_SIZE: ${{ inputs.batch_size || '0' }}
        run: |
          python3 scripts/mirror.py plan \
            --repository "$REPOSITORY" \
            --mode "$MODE" \
            --batch-size "$BATCH_SIZE" \
            --output .tmp/plan.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.plan.outputs.count != '0' && inputs.dry_run != true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Publish selected releases
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(python3 scripts/mirror.py publish --plan .tmp/plan.json)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          "${args[@]}"

      - name: Commit synchronization checkpoints
        if: always() && steps.plan.outcome == 'success' && inputs.dry_run != true
        run: |
          if git diff --quiet -- state; then
            echo "No state changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "chore: record published Helm charts"
          git push
